<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.5 system-ui, sans-serif;
      background: #0b0f13;
      color: #ece9e4;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 40rem; }
    h1 { font-weight: 500; letter-spacing: -0.03em; }
    p { color: #c9c5be; }
  </style>
</head>
<body>
  <main>
    <h1>Hello</h1>
    <p>This is a new HTML file. Tell me what you want on the page and I’ll build it out.</p>
  </main>
</body>
</html>
